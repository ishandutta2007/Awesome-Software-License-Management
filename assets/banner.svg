<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    
    /* Background Dynamic Animations */
    @keyframes pulse {
      0% { transform: scale(1) rotate(0deg); opacity: 0.2; }
      50% { transform: scale(1.08) rotate(180deg); opacity: 0.4; }
      100% { transform: scale(1) rotate(360deg); opacity: 0.2; }
    }
    @keyframes float-slow {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -80; }
    }

    .bg-shape-1 {
      transform-origin: 950px 175px;
      animation: pulse 18s infinite linear;
    }
    .bg-shape-2 {
      animation: float-slow 6s ease-in-out infinite;
    }
    .flowing-line {
      stroke-dasharray: 10, 10;
      animation: dash 5s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Dynamic Wave Grid Lines -->
  <g opacity="0.15">
    <path class="flowing-line" d="M -100 280 Q 300 350 600 200 T 1300 150" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="flowing-line" d="M -100 200 Q 400 100 800 250 T 1300 280" fill="none" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Background Animated Geometric Art (Right Side - Behind Text Layer) -->
  <g class="bg-shape-1">
    <polygon points="950,60 1070,135 1070,265 950,340 830,265 830,135" fill="none" stroke="url(#glow-grad)" stroke-width="3" />
    <circle cx="950" cy="175" r="90" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
    <circle cx="950" cy="175" r="50" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Floating Decorative Nodes (Far Right / Background) -->
  <g class="bg-shape-2" opacity="0.7">
    <g transform="translate(1000, 90)">
      <rect x="0" y="0" width="110" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="55" y="23" text-anchor="middle" class="badge-text" fill="#38bdf8">📜 SAM</text>
    </g>
    <g transform="translate(850, 240)">
      <rect x="0" y="0" width="110" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="55" y="23" text-anchor="middle" class="badge-text" fill="#818cf8">🛡️ ITAM</text>
    </g>
    <g transform="translate(1030, 230)">
      <rect x="0" y="0" width="110" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="55" y="23" text-anchor="middle" class="badge-text" fill="#c084fc">🔍 SCA</text>
    </g>
  </g>

  <!-- Foreground Content (Guaranteed Unobscured Title & Subtitle) -->
  <g transform="translate(80, 0)">
    <!-- Icon / Symbol -->
    <g transform="translate(0, 75)" filter="url(#glow)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <path d="M 18 20 L 38 20 M 18 28 L 38 28 M 18 36 L 30 36 M 34 34 L 38 38 L 44 30" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Main Title -->
    <text x="76" y="118" class="title">Awesome Software License Management</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">Curated SaaS Products, Enterprise ITAM/SAM Platforms & Open-Source SCA Scanners</text>

    <!-- Pill Badges Row -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="20" cy="19" r="5" fill="#38bdf8"/>
      <text x="35" y="24" class="badge-text">Software Asset</text>

      <!-- Pill 2 -->
      <rect x="172" y="0" width="160" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="192" cy="19" r="5" fill="#818cf8"/>
      <text x="207" y="24" class="badge-text">License Compliance</text>

      <!-- Pill 3 -->
      <rect x="344" y="0" width="160" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="364" cy="19" r="5" fill="#c084fc"/>
      <text x="379" y="24" class="badge-text">SaaS Optimization</text>
    </g>
  </g>
</svg>
